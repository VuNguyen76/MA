<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Mai Anh’s Green Closet — Fashion Studio</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a3323" />
  <meta name="color-scheme" content="light" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mai Anh Closet" />
  <meta name="application-name" content="Mai Anh’s Green Closet" />
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
  <meta name="description" content="Tủ đồ cá nhân của Mai Anh — Số hóa trang phục, tách nền AI và Mix & Match mỗi ngày." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='18' fill='%231a3323'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' fill='%23faf8f5' font-family='Georgia,serif' font-size='32' font-style='italic'>M</text></svg>" />

  <!-- Typography: Plus Jakarta Sans & Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Font Awesome 6 Free -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div class="ambient-glow glow-top" aria-hidden="true"></div>
  <div class="ambient-glow glow-bottom" aria-hidden="true"></div>

  <div class="shell">
    <!-- APP HEADER (3-ZONE EDITORIAL ISLAND) -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-eyebrow">
          <span class="brand-dot"></span>
          <span>MAI ANH · STYLE STUDIO</span>
        </div>
        <h1 class="brand-name">Green <em>Closet</em></h1>
      </div>

      <nav class="studio-nav" aria-label="Điều hướng chính">
        <div class="studio-nav-track">
          <button type="button" class="tab-pill active" data-tab="studio">
            <i class="fa-solid fa-shirt tab-icon" aria-hidden="true"></i>
            <span>Tủ đồ</span>
          </button>
          <button type="button" class="tab-pill" data-tab="saved">
            <i class="fa-regular fa-bookmark tab-icon" aria-hidden="true"></i>
            <span>Đã lưu <span id="savedCount"></span></span>
          </button>
        </div>
      </nav>

      <div class="header-tools">
        <button type="button" class="icon-pill" id="syncCloudBtn" title="Đồng bộ dữ liệu" aria-label="Đồng bộ dữ liệu">
          <i class="fa-solid fa-arrows-rotate" id="syncIcon" aria-hidden="true"></i>
          <span class="sync-label" id="syncStatusText"></span>
        </button>
        <button type="button" class="btn-primary" id="uploadBtn">
          <span>Thêm đồ</span>
          <span class="btn-bubble"><i class="fa-solid fa-plus" aria-hidden="true"></i></span>
        </button>
      </div>
    </header>

    <!-- MAIN WORKSPACE -->
    <main id="studio" class="workspace-grid">
      <!-- CỘT 1: TỦ ĐỒ -->
      <section class="bezel-shell closet-section">
        <div class="bezel-core section-inner">
          <div class="section-toolbar">
            <h2 class="section-heading">Tủ đồ</h2>
            <div class="toolbar-actions">
              <select id="seasonFilter" class="filter-select" aria-label="Lọc theo dịp mặc">
                <option value="">Mọi dịp</option>
                <option>Đi làm</option>
                <option>Đi chơi dạo phố</option>
                <option>Dự tiệc</option>
                <option>Du lịch</option>
                <option>Đi tập</option>
                <option>Mặc ở nhà</option>
              </select>
              <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-ico" aria-hidden="true"></i>
                <input id="search" class="search-field" placeholder="Tìm kiếm trang phục..." />
              </div>
            </div>
          </div>

          <div id="filters" class="filters"></div>
          <div id="closet" class="closet"></div>
        </div>
      </section>

      <!-- CỘT 2: BẢNG LOOKBOOK & PHỐI OUTFIT -->
      <aside class="bezel-shell lookbook-section">
        <div class="bezel-core section-inner">
          <div class="section-toolbar">
            <h2 class="section-heading">Today's Outfit</h2>
            <div class="toolbar-actions">
              <button type="button" class="icon-pill icon-pill-sm" id="aiGenerateBtn" title="Tạo ảnh phối đồ AI" aria-label="Tạo ảnh phối đồ AI">
                <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i>
              </button>
              <button type="button" class="icon-pill icon-pill-sm" id="clearBoard" title="Làm mới bảng phối" aria-label="Làm mới bảng phối">
                <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <div class="artboard-card">
            <div class="artboard-meta">
              <span class="artboard-label">Lookbook Canvas</span>
              <span class="pill-badge" id="mixCount">0 món</span>
            </div>

            <div id="mixCanvas" class="mixcanvas empty" aria-live="polite" aria-label="Khung ảnh phối đồ"></div>

            <div id="aiResultBox" class="ai-result-box hidden">
              <div class="ai-result-head">
                <span class="artboard-label"><i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i></span>
                <div class="ai-head-actions">
                  <button type="button" class="btn-close-sm" id="zoomAiImg" title="Xem toàn màn hình" aria-label="Xem toàn màn hình">
                    <i class="fa-solid fa-magnifying-glass-plus" aria-hidden="true"></i>
                  </button>
                  <button type="button" class="btn-close-sm" id="closeAiResult" aria-label="Đóng">
                    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                  </button>
                </div>
              </div>
              <div id="aiResultStage" class="ai-result-stage"></div>
              <div class="ai-result-actions">
                <button type="button" class="btn-subtle" id="downloadAiImg">
                  <i class="fa-solid fa-download" aria-hidden="true"></i>
                  <span>Tải ảnh</span>
                </button>
                <button type="button" class="btn-accent" id="saveAiToLooks">
                  <i class="fa-regular fa-bookmark" aria-hidden="true"></i>
                  <span>Lưu bộ sưu tập</span>
                </button>
              </div>
            </div>
          </div>

          <div class="save-row">
            <input id="lookName" class="luxury-input" placeholder="Đặt tên: Đi cà phê, Dạo phố..." maxlength="100" />
            <button type="button" class="btn-accent" id="saveLook">
              <span>Lưu</span>
              <span class="btn-bubble"><i class="fa-regular fa-bookmark" aria-hidden="true"></i></span>
            </button>
          </div>
        </div>
      </aside>
    </main>

    <!-- TAB 2: BỘ SƯU TẬP OUTFIT ĐÃ LƯU -->
    <section id="saved" class="bezel-shell hidden">
      <div class="bezel-core section-inner">
        <div class="section-toolbar">
          <h2 class="section-heading">Bộ sưu tập Outfit</h2>
        </div>
        <div id="savedGrid" class="savedgrid"></div>
      </div>
    </section>

    <footer class="app-footer">
      <span>MAI ANH’S GREEN CLOSET · HAUTE STUDIO</span>
    </footer>
  </div>

  <!-- MODAL: THÊM & SỬA MÓN ĐỒ -->
  <div id="dialogBack" class="dialogback hidden">
    <div class="dialog-shell" role="dialog" aria-modal="true">
      <div class="dialog-core">
        <div class="dialog-header">
          <h2 id="dialogTitle" class="dialog-title">Thêm đồ vào tủ</h2>
          <button type="button" class="btn-close" id="closeDialog" aria-label="Đóng">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>

        <div class="field" id="fileField">
          <label for="photoInput" class="field-title">Ảnh chụp (Có thể chọn nhiều ảnh)</label>
          <div class="dropzone-box">
            <input id="photoInput" type="file" accept="image/*" multiple />
            <div class="dropzone-label">
              <i class="fa-regular fa-image dropzone-icon" aria-hidden="true"></i>
              <span class="dropzone-main">Chọn hoặc kéo thả ảnh vào đây</span>
              <span class="dropzone-sub">Tự động tách nền để phối đồ sắc nét</span>
            </div>
          </div>

          <div class="remove-mode-row">
            <label class="mode-option active" id="modeFastOpt">
              <input type="radio" name="bgMode" value="fast" checked />
              <span><i class="fa-solid fa-bolt" aria-hidden="true"></i> Tách siêu tốc</span>
            </label>
            <label class="mode-option" id="modeAiOpt">
              <input type="radio" name="bgMode" value="ai" />
              <span><i class="fa-solid fa-wand-sparkles" aria-hidden="true"></i> AI Tách sâu</span>
            </label>
            <label class="mode-option" id="modeNoneOpt">
              <input type="radio" name="bgMode" value="none" />
              <span><i class="fa-regular fa-file-image" aria-hidden="true"></i> Ảnh gốc</span>
            </label>
          </div>
          <div id="bgStatus" class="bg-status" role="status" aria-live="polite"></div>
          <button type="button" id="restoreOriginal" class="btn-subtle hidden">
            <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>
            <span>Giữ ảnh gốc không tách nền</span>
          </button>
        </div>

        <div id="previews" class="previews"></div>

        <div class="ai-autotag-row">
          <button type="button" class="btn-subtle hidden" id="aiAutoTagBtn">
            <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i>
            <span>AI tự điền thông tin</span>
          </button>
        </div>

        <div class="formgrid">
          <div class="field">
            <label for="itemName" class="field-title">Tên món đồ</label>
            <input id="itemName" class="luxury-input" maxlength="100" placeholder="VD: Sơ mi lụa trắng" />
          </div>
          <div class="field">
            <label for="itemCat" class="field-title">Phân loại</label>
            <select id="itemCat" class="luxury-select"></select>
          </div>
          <div class="field">
            <label for="itemColor" class="field-title">Màu sắc</label>
            <input id="itemColor" class="luxury-input" maxlength="50" placeholder="Trắng kem, Olive..." />
          </div>
          <div class="field">
            <label for="itemSeason" class="field-title">Dịp mặc</label>
            <select id="itemSeason" class="luxury-select">
              <option value="">Tất cả các dịp</option>
              <option>Đi làm</option>
              <option>Đi chơi dạo phố</option>
              <option>Dự tiệc</option>
              <option>Du lịch</option>
              <option>Đi tập</option>
              <option>Mặc ở nhà</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="itemNote" class="field-title">Ghi chú phối</label>
          <input id="itemNote" class="luxury-input" maxlength="250" placeholder="Form suông, hợp quần ống rộng..." />
        </div>

        <div class="dialog-footer">
          <button type="button" class="btn-subtle" id="cancelDialog">Hủy</button>
          <button type="button" class="btn-primary" id="submitItem">
            <span>Cất vào tủ</span>
            <span class="btn-bubble"><i class="fa-solid fa-check" aria-hidden="true"></i></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- LIGHTBOX XEM ẢNH TOÀN MÀN HÌNH -->
  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="Xem ảnh toàn màn hình">
    <button type="button" class="lightbox-close" id="closeLightbox" aria-label="Đóng">
      <i class="fa-solid fa-xmark" aria-hidden="true"></i>
    </button>
    <img id="lightboxImg" src="" alt="" />
    <div id="lightboxCaption" class="lightbox-caption"></div>
  </div>

  <div id="toast" class="toast hidden" role="alert"></div>

  <script type="module" src="/index.js"></script>
</body>
</html>
